多个子问题\nQ1:  [[red]]kafa有哪些特性[[/red]]\nQ2： rocketMQ有哪些特性\nQ3 ：[[red]]kafa和rocketmq特性有哪些相同点[[/red]]\n\n这就是通过分解的方式，在接收到用户请求后，先增加一个大模型调用，通过大模型对原始问题进行逻辑解析和拆分。\n将拆分后的子查询列表分别进行检索，收集所有相关文档块。最后将所有文档块和原始问题一并输入给生成模型，得出最终答案。\n\nPrompt示例:\n# 角色\n你是一名专业的查询逻辑分析专家。\n\n# 任务\n将给定的“用户原始问题”分解为一系列 ** 相互独立、逻辑清晰 **，且可单独用于检索的子查询列表。\n你的输出必须是一个标准的JSON数组格式。\n\n# 用户原始问题\n{QUESTION}\n\n# 输出格式要求 (JSON Array)\n[\n    \"子查询1\",\n    \"子查询2\",\n    \"子查询3\",\n    \"...\"\n]\n\n（不强制要求数组元素个数，可根据真实情况输出，至少保留1个）\n\n# 输出\n请直接输出JSON数组，不要包含解释或多余的文字。\n2.2 富化\n\n[[red]]孵化是指[[/red]]在原始查询中添加上下文信息、背景知识或必要的限制条件，以消除歧义、补充缺失的信息，使查询更完整、更具体。\n比如 ，用在对话中问：他有什么特点？\n   这里的\"他\"就是一种指代，我们需要通过指代消除的方式来让LLM知道他到底是什么。\n所以，一般富化的场景主要用在当用户表达模糊或包含历史对话问题，且省略了主语或关键信息时（存在指定性表述）。或者是问题中缺少历史对话细节（例如，增加时间、地点、实体等限制，缩小检索范围。），或者是用到了某个专业术语的简称的时候。\n实现方式就是在接收到用户请求的问题后，先增加一个大模型调用，通过大模型对用户的原始问题进行重写。将重写丰富过后的问题，再进行相似度检索，继续后续流程。\n\nPrompt示例:\n# 角色\n你是一个专业的问题重写优化器。\n\n# 任务\n根据提供的“对话历史”和“用户原始问题”，重写为一个独立、完整、且包含所有必要背景信息的新查询，用于RAG检索。\n\n## 对话历史： \n{CHAT_HISTORY}\n\n## 原始问题： \n{QUESTION}\n\n# 输出\n输出富化过后的新问题，不要包含多余的解释性内容\n2.3 多样化\n多样化是指对同一个用户查询生成多个多个语义相近或相关的变体，以提升对知识库内容描述多样性的覆盖，从而增强召回率。主要应对以下情况：\n\n1. 描述风格不一致：文档的表述方式不同，如有的是“接口性能优化”，有的是“提升接口响应速度”。\n2. 用户表述差异性：不同用户的表达方式习惯不同。\n\n在接收到用户请求后，先增加一个大模型调用，通过大模型为原始问题生成多个语义相近但措辞不同的查询变体。\n将原始查询和所有变体并行进行检索。汇聚所有的检索结果，得到全部文档块，去重后用于后续生成。\n\nPrompt示例:\n# 角色\n你是一名专业的语义扩展专家。\n\n# 任务\n为给定的“原始问题”生成 ** 3\n个 ** 语义相同但 ** 措辞完全不同、且利于检索 ** 的查询变体，以提高检索的召回率。\n你的输出必须是一个标准的JSON数组格式。\n\n# 原始问题\n{QUESTION}\n\n# 输出格式要求 (JSON Array)\n[\n    \"变体1\",\n    \"变体2\",\n    \"变体3\"\n]\n\n# 输出\n[[red]]输出富化过后的新问题，不要包含多余的解释性内容[[/red]]\n\n2.4 回溯提示\n所谓回溯提示，是从Step-Back Prompting 翻译过来的，它的核心思想是先引导模型“后退一步”，从具体问题中抽象出更一般的原理、概念或背景知识；再基于这些抽象信息进行推理或检索，最终回答原始问题。\n比如,你做了一个企业内部知识库，有人提问：老舅结婚，我可以请几天假去参加他的婚礼。 \n这个问题知识库就很难回答，因为他太具体了，需要做step back，即把他转换成更抽象的问题：探亲假的请假政策是怎么样的？\n然后使用这个抽象问题抽象问题（或与原始问题结合）去向知识库检索相关信息。再将检索到的通用背景知识与原始具体问题结合，由 LLM 生成更准确、有深度的回答。\n\nPrompt示例:\n# 角色\n你是一个擅长抽象思维和原理推理的专家。\n\n# 任务\n请根据用户提出的具体问题，先“后退一步”，将其转化为一个更通用、更本质的问题，聚焦于背后的原理、规律、概念或一般性知识，而不是具体细节。\n\n# 原始问题\n\n{QUESTION}\n\n# 输出         \n请只输出改写后的“后退问题”，不要解释，不要包含原始问题，也不要回答它。\n\n2.5 落地\n\n这么多改写方案如何落地? 如何选择改写方案? 目前,市场主流方案有两种:\n2.5.1 组合方案\n如果不想做选择题，可以通过以下方式将多种改写方案融合，以提升检索的召回率（Recall）。\n2.5.1.1 并行改写 + 多路召回 + 重排（最常用）\n  不对改写方法做唯一选择，而是“既要又要”。\n  - 做法： 假设一个Query同时用 多角度扩展（Query Expansion） 和 子问题拆解（Sub-queries） 改写出4个新Query。将这4个Query分别送入向量数据库检索，各返回Top-K个文档。\n  - 融合： 使用 RRF（倒数排名融合） 算法或 Cross-Encoder重排模型（Reranker），将所有检索到的文档统一打分去重，筛选出最终的Top-N输入给LLM。\n2.5.1.2 串行流水线（Pipeline）\n将不同的改写方法变成前后顺承的关系。\n  - 链路示例： 原始输入\n  - $$\\rightarrow$$ 指代消解/上下文纠错（补全历史对话中的“它”、“那个”）\n  - $$\\rightarrow$$ 意图泛化/同义词替换（将专业词汇转换，扩大搜索面）\n  - $$\\rightarrow$$ 最终改写Query。\n2.5.2 区分使用方案.\n      如果为了节省算力或避免引入太多噪声，需要针对性地选择单一改写方法，可以通过 Router（路由机制） 来区分：\n2.5.2.1 依据“用户输入类型”分流（基于LLM或规则判断）\n[图片]\n2.5.2.2 依据“检索反馈”动态调整（Step-back / Re-write）\n- 先检索，不行再改写： 先用原始Query检索，计算Top-1文档的检索置信度（Score）。\n- 触发阈值： * 如果 Score $$>$$ 0.8 $$\\rightarrow$$ 直接使用。\n  - 如果 Score $$\u003c$$ 0.5 $$\\rightarrow$$ 触发退回一步（Step-Back Prompting），将具体问题抽象化后再检索；或者触发LLM重写。\n2.5.2.3 落地建议\n预算充足、追求准确率： 采用 “并行改写 + Reranker”。这是目前各大打榜系统和商业搜索的标准配置，效果最稳妥。\n追求高并发、低延迟： 采用 “意图路由（Router）”。用一个轻量级模型（或几条Prompt规则）判断Query类型，一触即发，只走一条改写分支。\n2.6 注意:\n问题重写，是生产级 RAG 的必备操作，但并非重写策略越多、逻辑越复杂，效果就越好。很多时候，我们的核心在于在性能与质量之间找到一个平衡点。过多冗余的流程会显著增加问答系统的响应时间，直接导致用户体验下降。因此，需结合自身业务需求，充分分析用户的提问习惯、交互方式、以及产品特点，灵活组合选用问题重写策略，才能最大化其价值。\n\n[[red]]正确备注：\n产品名是 Kafka，不是 Kafa 或 kafa。「孵化是指」应为「富化是指」，这一节的标题本来就是富化。多样化提示词的结尾抄成了富化的输出要求；富化只输出一个新问题，多样化要输出 JSON 数组里的多条变体。[[/red]]\n", "ease": 2.5, "interval_days": 0, "repetitions": 0, "due": "2026-11-18", "created_at": "2026-11-18T17:00:55", "mastery": "一般", "mastery_color": "#c44536", "content_at": "2026-11-19T11:33:42", "schedule_at": "2026-11-18T17:00:55", "studied_days": []}, {"id": 128, "uid": "pc-128", "domain_id": 5, "note_id": null, "front": "3. 查询路由", "back": "3. 查询路由\n\nRAG（Retrieval-Augmented Generation，检索增强生成）从外部知识源中检索相关信息，将相关的知识注入LLM中，使LLM能够回答超出预训练数据之外的问题，并提高生成内容的质量和相关性。\n从外部知识库检索知识，但是这个外部知识库，就一定是向量数据库么？不一定！这个检索就一定是向量检索么？也不一定！\n\n3.1 数据源路由\n\n举个简单的例子，如果我们想要基于RAG技术做一个企业内部的知识库，我们知道，企业内部的知识，有一些是文档的，这些我们可以通过向量数据库来检索。但是企业里面的一些组织架构信息呢？服务器的部署情况呢？企业里面的这些可不在文档中哦。只靠向量数据库肯定是不行的。\n所以，在RAG中，还可以通过其他的数据库查询，比如图数据库、向量数据库、关系型数据库都可以。于是，就有一个Query Routing的手段，把用户的请求转发到不同的数据库上面去查询。\n[图片]\n3.2 Prompt路由\n还有一种路由，也比较常见。那就是对提示词做路由。为了避免固定的提示词效果不好，我们可以提前定义好多个提示词，然后在用户提问的过程中，针对用户问题，先通过LLM来分析一下适合用哪个提示词。\n \n比如,你有以下两个提示词：\n\nPrompt 1：你是一个专业的医生，可以从专业的医疗角度给出患者建议。\nPrompt 2：你是一个专业的药学专家，掌握丰富的药品知识，能够在用药方面给出更好的建议。\n\n我们在构建一个医疗AI助手的时候，就可以做提示词的路由。根据用户是询问病情还是用药建议，使用不同的提示词。", "ease": 2.5, "interval_days": 0, "repetitions": 0, "due": "2026-11-18", "created_at": "2026-11-18T17:00:55", "mastery": "一般", "mastery_color": "#6d28d9", "content_at": "2026-11-19T11:33:42", "schedule_at": "2026-11-18T17:00:55", "studied_days": []}, {"id": 129, "uid": "pc-129", "domain_id": 5, "note_id": null, "front": "4. 查询构造", "back": "4. 查询构造\n前面我们提到的查询路由中，可以把用户问题路由到不同的数据库中去查询。如果是向量数据库，那么就可以去向量数据库查询了。\n 但是如果是图数据库或者关系型数据库，就需要先把自然语言转成SQL或者Cypher 才行。\n所以，在查询这一步，需要后续可能用到的查询方案，提前构造出对应的查询内容才行，比如你要从数据库中查询某个部门有多少人。\n那就应该提前把对应的SQL生成出来，然后去数据库做查询。这就需要有text-to-sql的能力。\n\nText2SQL（也称为 自然语言到SQL）是一种人工智能技术，其目标是将用户用自然语言（如中文、英文等）表达的查询意图，自动转换为结构化的 SQL 查询语句。这项技术融合了自然语言处理（NLP）和数据库查询技术，旨在降低非技术人员使用数据库的门槛，提升数据访问效率。\n \n以下是一个text2sql的实现方式，用LLM的方式帮我们生成想要的SQL。\n\nPrompt示例:\n# 角色\n你是一个SQL专家。请根据以下表结构信息将用户问题转换为SQL查询语句。特别注意，你只能查询，不能做修改、删除等操作。\n\n# 表结构信息\n\n{tables}\n\n# 用户问题\n\n{user_query}\n\n# 要求\n1.\n只返回SQL语句，不需要包含任何解释和说明\n2.\n确保SQL语法正确\n3.\n使用上下文中提供的表名和字段名\n4.\n如果根据所提供的表无法做查询，请直接返回空字符串\n\"\"\n\n# 其他说明\n今天是: {today}\n \n以上其实是个提示词模板，其中的{tables}、{user_query}以及{today}都需要实时替换。\n有了表结构（{tables}），知道详细的建表语句，LLM才知道具体的SQL该怎么写。另外时间也很重要，因为如果涉及到查询最近几天、过去几天、今天等的数据时，就需要知道当前时间。这个很关键。", "ease": 2.5, "interval_days": 0, "repetitions": 0, "due": "2026-11-18", "created_at": "2026-11-18T17:00:55", "mastery": "一般", "mastery_color": "#0f766e", "content_at": "2026-11-19T11:33:42", "schedule_at": "2026-11-18T17:00:55", "studied_days": []}, {"id": 130, "uid": "pc-130", "domain_id": 5, "note_id": null, "front": "5. HyDE", "back": "5. HyDE\nHyDE（Hypothetical Document Embeddings，假设性文档嵌入） 是一种创新的 RAG 增强技术。它的核心思想是：不要让用户问题直接去匹配答案，而是先让大模型“想象”一个假设的答案，然后用这个“假设答案”去知识库中寻找最相关的真实文档。\n \n它主要解决的问题是：\n- 词汇不匹配：用户的查询用语和知识库中文档的用语可能完全不同，尽管它们语义相似。\n  - 用户问：“感觉心情持续低落，对什么都提不起兴趣，怎么办？”\n  - 知识库有：“重度抑郁障碍的临床表现与治疗策略”。\n  - 虽然两者高度相关，但直接基于字面相似度的检索可能无法匹配。\n- 问题过于简短或模糊：用户的问题可能很短，缺乏足够的上下文信息，导致检索系统难以理解其真实意图。\n \n传统 RAG 是 “问题 -> 检索 -> 答案” 的流程，而 HyDE 在其中增加了一个关键的“想象”步骤。\n \n这听起来有点反直觉，但效果竟然还不错！？\n \n5.1 HyDE的工作流程\n \n5.1.1 第一步：生成假设答案\n  - 收到用户的原始查询后，不直接进行检索。\n  - 而是先将查询发送给LLM，并要求它生成一个假设性的、高质量的答案。\n \nPS：这个答案是基于模型自身的知识“编造”的，它可能正确，也可能不准确或包含事实错误。我们并不关心它的正确性，只关心它的语义和风格。\n \n比如用户想要查询：“如何给自行车链上油？”\n \nLLM 生成的假设答案：“给自行车链上油是一个简单的维护任务，可以显著提升骑行体验并延长链条寿命。首先，您需要准备专用的自行车链条油和一块干净的布。然后将自行车档位调到中间，以便可以顺畅地转动踏板，让链条移动。接着，在链条的每个关节处滴上少量的油，同时缓慢地倒转踏板，确保油均匀分布。最后，用布擦去链条上多余的油，防止吸附灰尘。”\n \n(注意：这个回答完全是模型自己“想”出来的，可能漏掉关键步骤或推荐了错误的产品，但这没关系！)\n \n5.1.2 第二步：用假设答案进行检索\n  - 拿到上一步生成的“假设答案”后，我们将其转换成一个向量。\n  - 用这个“假设答案”的向量（而不是用户原始问题的向量）去向量数据库中进行相似度搜索，找出最相关的文档片段。\n \n因为“假设答案”通常比原始问题更长、包含更多相关的关键词和上下文。例如，它包含了“链条油”、“倒转踏板”、“擦去多余的油”等具体术语，这些术语更有可能与知识库中正确的指导文档匹配。\n \n而且“假设答案”的文本风格与知识库中的真实文档风格可能是一致的，而用户问题则未必。这使得向量相似度计算更加精准。\n \n5.1.3 第三步：合成最终答案\n  - 检索系统返回一组与“假设答案”高度相关的真实、可靠的文档片段。\n  - 将这些真实文档和用户的原始问题一起交给 LLM，让它生成一个事实准确、有据可循的最终答案。", "ease": 2.5, "interval_days": 0, "repetitions": 0, "due": "2026-11-18", "created_at": "2026-11-18T17:00:55", "mastery": "一般", "mastery_color": "#3f6212", "content_at": "2026-11-19T11:33:42", "schedule_at": "2026-11-18T17:00:55", "studied_days": []}, {"id": 131, "uid": "pc-131", "domain_id": 5, "note_id": null, "front": "6. 混合检索", "back": "6. 混合检索\n在检索增强生成流程中，混合检索（Hybrid Search）是提高检索阶段质量的关键高级技术。它确保了大模型在生成答案之前，能够获得语义最相关、关键词最精确的上下文信息。\n6.1 传统检索方式\n传统的单一检索方式存在以下局限：\n\n稠密检索/向量检索（如基于向量的语义相似度搜索）：\n- 能捕捉语义信息，但可能在精确关键词匹配上表现不佳。\n- 对训练数据、包括文档的质量、切片和嵌入质量高度依赖，容易受嵌入偏差影响。\n \n稀疏检索/关键字搜索（如 BM25）：\n- 依赖文档切分出来的关键词进行匹配。\n- 无法理解语义相似但用词不同的查询与文档（例如“汽车” vs “轿车”）。\n \n比如在ElasticSearch中，倒排索引是一种将“关键词”映射到“文档ID”的数据结构，实现了快速定位候选文档。BM25（Best Match 25）则是在通过倒排索引查找到候选文档后，利用其词频（TF）和逆文档频率（IDF）计算相关性得分并排序的算法。\n\n[图片]\n\n混合检索（Hybrid Search）是一种复合的检索策略，它结合了至少两种不同类型的搜索算法，以利用它们各自的优势，克服单一检索模式的固有缺陷。\n\n6.2 为什么需要混合检索\n混合检索就是通过融合两者的优势，在保持语义理解能力的同时保留关键词匹配的精确性，从而提高检索结果的召回率（Recall）和排序质量（Ranking Quality），最终提升 RAG 系统的整体性能（如回答准确性、事实一致性）。\n混合检索将两者结合，使系统既能深刻理解用户意图（语义优势），又能确保检索结果不偏离核心关键词（关键字优势），从而显著提升 RAG 的召回质量，能解决以下问题： \n1. 语义匹配但细节错误\n  1. 向量检索可能返回语义相关但关键信息（如时间、型号、编号）错误的内容。\n  2. 混合检索通过关键词精确匹配修正偏差。\n2. 字面匹配但语义无关\n  1. 关键词检索无法理解同义词或模糊表达（如“重置密码” vs “找回密码”）。\n  2. 向量检索可捕捉语义关联，弥补此缺陷。\n3. 低频词或专业术语召回困难\n  1. 向量模型对罕见词表示弱，而关键词检索（如 BM25）对此更敏感。\n4. 降低大模型“幻觉”风险\n  1. 更精准的检索结果 → 更可靠的知识输入 → 减少模型编造答案。\n\n6.3 混合检索的常见做法\n\n混合检索的常见做法就是并行多路召回 + 结果融合。\n \n也就是说把同一个查询同时送入：关键词检索模块（如 Elasticsearch / BM25）、向量检索模块（如 Milvus / FAISS / PgVector），然后再对对两路结果进行融合排序。\n \n融合排序有以下常见算法：\n \n- 加权求和（Score Weighting）最终得分 = α × 向量得分 + (1−α) × 关键词得分（需归一化得分，α 通常通过实验调优）\n- 重排序，包括RRF、Cross-Encoder等", "ease": 2.5, "interval_days": 0, "repetitions": 0, "due": "2026-11-18", "created_at": "2026-11-18T17:00:55", "mastery": "一般", "mastery_color": "#0369a1", "content_at": "2026-11-19T11:33:42", "schedule_at": "2026-11-18T17:00:55", "studied_days": []}, {"id": 132, "uid": "pc-132", "domain_id": 5, "note_id": null, "front": "7. 重排序", "back": "7. 重排序\n7.1 什么是重排序\n \n重排序（Reranking）是在通过混合检索（或其他方式）获得初步检索结果（候选文本块）后，再通过更强的模型（通常是 Cross-Encoder 或专用 Reranker 模型）对这些候选文本块进行重新打分和排序，将真正最相关、最有价值的内容排在前面。\n \n重排序的意义\n1. 过滤噪声：初步检索往往会召回数十条文档，其中可能混杂着相关性较低的“噪声”内容。\n2. 提升答案精度：重排序模型能够更细致地评估查询和文档对之间的相关性，比初次检索使用的相似度查询会更准确。\n3. 优化上下文窗口利用率：通过将最相关的少数文档（通常是3-5个）置于最前端，确保 LLM 的有限输入窗口被最高质量的上下文填充，让最终的生成内容基于相对更正确、更有依据的上下文。\n重排序能显著提升 RAG 的可靠性和最终回答质量，是 Advanced RAG 系统的关键环节。\n \n7.2 实现重排序\n7.2.1 RRF算法\nRRF（Reciprocal Rank Fusion-倒数排名融合）是一种轻量级且高效的检索结果融合算法，用于将来自不同检索方法（如向量检索和关键词检索）的结果合并。它通过文档在各个检索结果中的排名来计算得分。\n \nRRF 的基本思想是：\n一个文档在多个排序列表中排名越靠前、出现次数越多，其融合得分就越高。\n它不依赖于原始得分（如 BM25 分数、神经网络打分等），只使用排名位置（rank），因此具有良好的通用性和鲁棒性。\n \n对每一个文档（或结果项）d，RRF 给它打一个分数：\n[图片]\n- rank i是文档d在第i个列表中的排名（从 1 开始计数）；\n- 如果 d 不在第 i 个列表里，就忽略这一项（或者视为无穷大，不加分）；\n- K 是一个常数（通常取 60），用于控制低排名文档的权重，避免低排名文档对总分影响过大。\n- 把所有模型中 d 的“倒数排名”加起来，就是它的 RRF 分数；\n- 最后按 RRF 分数从高到低排序，得到最终结果。\n \n注意：这里用的是 “倒数排名”（reciprocal rank），所以排名越靠前（比如第1名），贡献的分数越大（1/(1+60) ≈ 0.016），而排第10名就只有 1/(10+60) ≈ 0.014，差别虽小但有意义。\n \n算法将同一文档在不同检索结果中的分数累加，最后根据 RRF 得分降序排序，取 topK 结果。\n \nRRF 的优势在于实现简单、无需对不同检索系统的分数进行复杂归一化，同时对低排名或噪声项不敏感，能够稳健地融合多源检索结果。\n \n它特别适合混合检索场景，如将向量检索与关键词检索结果结合，充分利用各检索方法的优势，提高最终排序的准确性和覆盖率。\n1. 无需原始分数：仅依赖排名，适用于异构系统（如传统 BM25 + 向量检索）。\n2. 对高排名更敏感：靠前的排名对得分贡献更大（因为是倒数关系）。\n3. 简单高效：计算开销小，易于实现。\n4. 实证效果好：在 TREC 等标准评测中表现优异，尤其适合多阶段检索架构。\n\n7.2.2 ReRank模型\nReRank 模型是检索流程中的关键组件，作用是对初步检索得到的候选文档进行二次精细排序。它能深入理解查询与文档的语义关联，比传统检索方法更精准地判断相关性，从而提升检索结果的质量。\n主要流程就是先通过向量检索、关键词检索等方式获取一批候选文档，再由 ReRank 模型对这些文档重新排序，最终输出最相关的结果。\n需要注意的是，ReRank 模型通常基于专门训练的语义匹配模型（如 Cross-Encoder 或特化的语义排序模型），它会同时输入“查询 + 文本”进行相关性评分，因此本质上更偏向于语义层面的匹配。这种语义优势也可能带来潜在问题：当结合关键词检索与向量检索做混合检索时，ReRank 模型可能更倾向于提升语义相似度高的文档排序，从而弱化那些虽然关键词匹配度高但语义表达不强的结果。\n重排序用于对初筛结果进行精细优化，通过更复杂的相关性模型对候选文档进行重新排序，其核心价值在于提升结果的排序精度，特别适用于问答系统和精准信息检索等对结果准确性要求较高的场景。\n在实际应用中，重排序可以灵活地部署在各种 RAG 架构的最终环节，根据具体业务需求进行调整。归根结底，它的目标是在响应速度与回答质量之间找到最佳平衡，从而最大化知识问答的实用价值。", "ease": 2.5, "interval_days": 0, "repetitions": 0, "due": "2026-11-18", "created_at": "2026-11-18T17:00:55", "mastery": "一般", "mastery_color": "#1d4e89", "content_at": "2026-11-19T11:33:42", "schedule_at": "2026-11-18T17:00:55", "studied_days": []}, {"id": 133, "uid": "pc-133", "domain_id": 5, "note_id": null, "front": "8. Graph RAG", "back": "8. Graph RAG\n\nGraph RAG 是一种结合了图结构（Graph）与RAG,技术的新型人工智能架构。它在传统 RAG 的基础上引入了知识图谱或由文本构建的图结构，以更有效地组织、检索和利用信息，从而提升大语言模型（LLM）在复杂问答、推理和知识密集型任务中的表现。\n \n传统的 RAG 方法通常包括两个步骤：\n1. 检索（Retrieval）：从大规模文档库中用向量相似度（如 embedding）检索出与用户查询最相关的若干段落。\n2. 生成（Generation）：将检索到的内容与原始问题一起输入 LLM，生成答案。\n但这种方法存在一些问题：\n- 上下文碎片化：检索到的段落彼此孤立，缺乏语义关联。\n- 难以处理多跳推理：例如“爱因斯坦在哪所大学工作过？该校位于哪个国家？”需要两步推理，传统 RAG 难以有效支持。（虽然问题改写可以解决一部分，但是跳数过多，或者逻辑过于复杂的未必能解决）\n- 重复/冗余信息：不同文档可能包含相同事实，导致信息冗余或冲突。\n- 缺乏全局知识结构：无法利用实体之间的关系进行推理。\n \nGraph RAG 的核心思想是：将非结构化文本转化为结构化的图，并在图上进行智能检索与推理。\n \n[图片]\n \nGraphRAG和传统RAG的主要区别就是会借助图数据库和知识图谱技术，抽取文档中的实体之间的关系，构建一个图结构，[[red]]不再依赖相似度检索，而是改用图的拓扑结构来定位相关信息[[/red]]。\n \n8.1 知识图谱\n \n知识图谱是一种以图结构表示实体及其之间关系的知识库。它将现实世界中的事物（如人、地点、事件、概念等）建模为节点（实体），将它们之间的语义关系建模为边（关系）。\n \n典型三元组形式：(实体, 关系, 实体)\n \n例如：(吴京, 参演过, 战狼)\n \n8.2 图数据库\n \n图数据库是一种专门用于存储、查询和管理图结构数据的 NoSQL 数据库。它以节点（Node）、边（Edge/Relationship） 和 属性（Property） 为核心模型，天然适合表达和处理高度互联的数据。\n \n- 节点（Node）：表示实体，如“用户”、“商品”、“城市”。\n- 边（Edge / Relationship）：表示节点之间的关系，如“购买”、“关注”、“位于”。边是有方向的（可选），并可携带属性。\n- 属性（Property）：键值对，用于描述节点或边的特征，如 {name: \"张三\", age: 30}。\n \n图数据库如果只能推荐一个的话，那一定是Neo4j\n \n接下来，我们就以Neo4J为例，介绍一个通过图数据库+知识图谱做检索的例子，使我们的RAG系统能够回答这样的多跳问题：电影《十面埋伏》的导演，还导演过什么电影？\n \n这是一个经典的多跳图查询，我们需要在 Neo4j 中执行以下逻辑：\n1. 找到电影《十面埋伏》\n2. 找到导演了这部电影的导演。\n3. 找出该导演还导演了哪些其他电影。\n\n产品: [[red]]nero4j[[/red]] \n\n规划:\nRAG: \n在线\n\n离线 :\n   原始文档--->文本--->分块--->向量--->向量数据\n- 原始文档-->文本\n- 文本--->分块\n- 分块--->向量\n- 向量--->向量数据库\n评测 :\n\n[[red]]少--较多--好多--膨胀--减--优![[/red]]\n\n[[red]]Activity\nActiviti[[/red]]\n\n[[red]]正确备注：\n图检索通常仍要先找到入口实体，这一步经常还是关键词或向量，找到后再沿边做多跳。它是在相似度检索之外增加关系，不是取消相似度检索。产品名是 Neo4j。标红的「规划、Activity、Activiti」不是 Graph RAG 的内容，Activiti 是工作流引擎。[[/red]]\n", "ease": 2.5, "interval_days": 0, "repetitions": 0, "due": "2026-11-18", "created_at": "2026-11-18T17:00:55", "mastery": "一般", "mastery_color": "#9f1239", "content_at": "2026-11-19T11:33:42", "schedule_at": "2026-11-18T17:00:55", "studied_days": []}, {"id": 134, "uid": "pc-134", "domain_id": 5, "note_id": null, "front": "9、RAG 评测", "back": "9、RAG 评测\n\n评测标准\n\n- 检索评估\n  - 召回率:   查的全不全\n  - 准确率:   查的准不准\n  - F1分数: 召回率和准确率的调和平均数\n- 生成评估\n  - 忠实度: 上下文 和 答案\n  - 相关性: 比如 问题 : 徐高锋是不是个坏人  答案:徐高锋今年18\n  - 正确性: 生成的答案  和  标准答案\n\n思想 : LLM as a Judge\n\n传统测评手段:\n\n- 人工评估:\n  - 最准确的评估方法\n  - 贵/慢/规模小\n- 基于规则评估\n  - 代码写死/正则/关键词\n  - 死板不灵活,对于灵活自然语言处理机械\n\n核心思想: 能力更牛逼的模型作为裁判! 让他根据预设规则 去给另外一个模型(被测的模型)打分!\n\n工作模式:\n- 无参考评估:\n     不提供标准答案,仅根据问题和模型答案评估  ;  适用主观场景\n- 有参考评估:\n除了Query  问题 和 Answer  答案  还要提供 Ground Truth  标准答案 ; 基于事实场景(客观)\n\n落地: 测评框架 RAGAS\n\n为什么?\n  RAGAS 设计非常符合RAG 运行原理, [[red]]支持没有标准答案情况下自动进行评估![[/red]]\nRAGAS 原理?\n LLM as a Judge\n\n- RAGAS  评测如何避免幻觉\n\n- 评测的数据集怎评价?\n\n- 如何产生评测数据集?\n\n[[red]]正确备注：\n没有标准答案时，RAGAS 可以评忠实度和答案相关性。上下文召回、答案正确性通常需要参考材料或标准答案。避免裁判模型胡编：先摘出依据再打分，温度放低，同一题多评一次，再抽一部分人工核对。评测集要像真实提问，每题能指回来源，并包含事实题、多跳题和不该回答的题。题可以从真实日志抽取后由人补出处，也可以让模型按文档出题，再删掉文档里答不出的题。[[/red]]\n", "ease": 2.5, "interval_days": 0, "repetitions": 0, "due": "2026-11-18", "created_at": "2026-11-18T17:00:55", "mastery": "一般", "mastery_color": "#be185d", "content_at": "2026-11-19T11:33:42", "schedule_at": "2026-11-18T17:00:55", "studied_days": []}], "reviews": [{"id": 1, "uid": "pc-1", "card_id": 1, "quality": 4, "reviewed_at": "2026-11-18T16:13:13", "interval_after": 1, "ease_after": 2.5}], "tombstones": [], "next": {"domain": 6, "note": 7, "card": 135, "review": 2}}</script>
  <script>
    const KEY = "study-room-phone-v1";
    const COLORS = ["#c44536","#d97706","#0f766e","#1d4e89","#6d28d9","#be185d","#3f6212","#b45309","#0369a1","#9f1239","#0e7490","#7c3aed"];
    const TERMS = ["Retrieval-Augmented Generation","Reciprocal Rank Fusion","Function Calling","Text2SQL","Cross-Encoder","Embedding Model","Graph RAG","GraphRAG","LangChain","LangGraph","向量数据库","嵌入模型","检索增强生成","混合召回","重排序","知识图谱","查询改写","查询路由","装饰器","生成器","迭代器","元数据","相似度","分块","幻觉","Milvus","Redis","HNSW","HyDE","RAGAS","RAG","LLM","GPT","BERT"];
    const seed = JSON.parse(document.getElementById("seed").textContent);
    let db = load();
    let domainId = null;
    let index = 0;
    let revealed = false;
    let editing = false;

    function pad(n) { return String(n).padStart(2, "0"); }
    function today() {
      const date = new Date();
      return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate());
    }
    function addDays(iso, days) {
      const parts = iso.split("-").map(Number);
      const date = new Date(parts[0], parts[1] - 1, parts[2]);
      date.setDate(date.getDate() + days);
      return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate());
    }
    function load() {
      try {
        const saved = JSON.parse(localStorage.getItem(KEY) || "null");
        if (saved && saved.cards) return saved;
      } catch (error) {}
      const fresh = JSON.parse(JSON.stringify(seed));
      localStorage.setItem(KEY, JSON.stringify(fresh));
      return fresh;
    }
    function save() { localStorage.setItem(KEY, JSON.stringify(db)); }
    function schedule(quality, repetitions, ease, interval) {
      ease = ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
      if (ease < 1.3) ease = 1.3;
      ease = Math.round(ease * 10000) / 10000;
      if (quality < 3) return [0, ease, 1];
      let next = 1;
      if (repetitions === 1) next = 6;
      else if (repetitions > 1) next = Math.max(1, Math.round(interval * ease));
      return [repetitions + 1, ease, next];
    }
    function escapeHtml(value) {
      return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function rich(value, highlight) {
      let html = escapeHtml(value || "").replace(/\[\[red\]\]/g, '<span class="bad">').replace(/\[\[\/red\]\]/g, "</span>");
      if (highlight) {
        TERMS.slice().sort((a, b) => b.length - a.length).forEach((term) => {
          html = html.split(term).join("<strong>" + term + "</strong>");
        });
      }
      return html;
    }
    function domainName(id) {
      const found = db.domains.find((item) => item.id === id);
      return found ? found.name : "";
    }
    function queue() {
      const day = today();
      return db.cards
        .filter((card) => card.due <= day && (domainId == null || card.domain_id === domainId))
        .sort((a, b) => a.due === b.due ? a.id - b.id : a.due < b.due ? -1 : 1);
    }
    function randomColor(previous) {
      const choices = COLORS.filter((color) => color !== previous);
      return choices[Math.floor(Math.random() * choices.length)];
    }

    function render() {
      const names = db.domains.map((item) => `<button class="chip ${domainId === item.id ? "on" : ""}" data-id="${item.id}">${item.name}</button>`).join("");
      document.getElementById("domains").innerHTML = `<button class="chip ${domainId == null ? "on" : ""}" data-id="">全部</button>` + names;
      document.getElementById("status").textContent = "手机本地题库 · " + db.cards.length + " 张 · 电脑关机也能背";
      const interview = db.domains.find((item) => item.name === "面试题库");
      const showProgress = interview && (domainId === interview.id || queue().some((card) => card.domain_id === interview.id));
      if (interview && domainId === interview.id) {
        const cards = db.cards.filter((card) => card.domain_id === interview.id);
        const done = cards.filter((card) => (card.studied_days || []).includes(today())).length;
        document.getElementById("progress").textContent = "今日复习进度 " + done + "/" + cards.length;
      } else {
        document.getElementById("progress").textContent = "";
      }
      const cards = queue();
      if (index >= cards.length) index = 0;
      const study = document.getElementById("study");
      if (!cards.length) {
        study.innerHTML = `<p class="kicker">今天的清单已经清空</p><h2 class="prompt">没有到期的卡片</h2>`;
        return;
      }
      const card = cards[index];
      const highlight = domainName(card.domain_id) === "面试题库";
      if (editing) {
        study.innerHTML = `
          <p class="kicker">${domainName(card.domain_id)} · 正在改这道题</p>
          <textarea class="inline" id="edit-front">${escapeHtml(card.front)}</textarea>
          <textarea class="inline tall" id="edit-back">${escapeHtml(card.back)}</textarea>
          <div class="row">
            <button class="btn primary" id="save-edit" type="button">保存</button>
            <button class="btn" id="cancel-edit" type="button">取消</button>
          </div>`;
        document.getElementById("save-edit").addEventListener("click", () => {
          const front = document.getElementById("edit-front").value.trim();
          const back = document.getElementById("edit-back").value.trim();
          if (!front || !back) return;
          card.front = front;
          card.back = back;
          editing = false;
          save();
          render();
        });
        document.getElementById("cancel-edit").addEventListener("click", () => {
          editing = false;
          render();
        });
        document.getElementById("edit-front").focus();
        return;
      }
      const levels = ["一般", "基本掌握", "熟练"].map((level) => {
        const on = card.mastery === level && card.mastery_color;
        const style = on ? ` style="background:${card.mastery_color};border-color:${card.mastery_color}"` : "";
        return `<button class="level ${on ? "on" : ""}"${style} data-level="${level}">${level}</button>`;
      }).join("");
      const studied = (card.studied_days || []).includes(today());
      study.innerHTML = `
        <p class="kicker">${domainName(card.domain_id)} · ${index + 1} / ${cards.length}</p>
        <div class="prompt">${rich(card.front, highlight)}</div>
        ${highlight ? `<div class="row"><span class="meta">掌握程度</span>${levels}<button class="studied ${studied ? "done" : ""}" id="studied">今日已复习</button></div>` : ""}
        ${revealed ? `<div class="answer">${rich(card.back, highlight)}</div>` : ""}
        <div class="row">
          ${revealed
            ? `<button class="btn again" data-quality="1">重来</button><button class="btn hard" data-quality="3">困难</button><button class="btn good" data-quality="4">记得</button><button class="btn easy" data-quality="5">简单</button>`
            : `<button class="btn primary" id="reveal">看答案</button>`}
          <button class="btn" id="edit-card" type="button">编辑</button>
        </div>`;
      document.getElementById("reveal")?.addEventListener("click", () => { revealed = true; render(); });
      document.getElementById("edit-card")?.addEventListener("click", () => { editing = true; render(); });
      study.querySelectorAll("[data-quality]").forEach((button) => button.addEventListener("click", () => rate(card, Number(button.dataset.quality))));
      study.querySelectorAll("[data-level]").forEach((button) => button.addEventListener("click", () => {
        card.mastery = button.dataset.level;
        card.mastery_color = randomColor(card.mastery_color || "");
        save();
        render();
      }));
      document.getElementById("studied")?.addEventListener("click", () => {
        card.studied_days = card.studied_days || [];
        if (!card.studied_days.includes(today())) card.studied_days.push(today());
        save();
        render();
      });
    }

    function rate(card, quality) {
      const result = schedule(quality, card.repetitions || 0, card.ease || 2.5, card.interval_days || 0);
      card.repetitions = result[0];
      card.ease = result[1];
      card.interval_days = result[2];
      card.due = addDays(today(), result[2]);
      revealed = false;
      editing = false;
      save();
      render();
    }

    document.getElementById("domains").addEventListener("click", (event) => {
      const button = event.target.closest("[data-id]");
      if (!button) return;
      domainId = button.dataset.id ? Number(button.dataset.id) : null;
      index = 0;
      revealed = false;
      editing = false;
      render();
    });
    document.getElementById("backup").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(db)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "闪记进度.json";
      link.click();
    });
    document.getElementById("restore").addEventListener("click", () => document.getElementById("restore-file").click());
    document.getElementById("restore-file").addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const next = JSON.parse(await file.text());
      if (!next.cards) return;
      db = next;
      save();
      index = 0;
      revealed = false;
      render();
    });
    render();
  </script>
</body>
</html>
