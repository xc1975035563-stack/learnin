<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>自习室</title>
  <link rel="stylesheet" href="/static/style.css?v=8" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <p class="eyebrow">一个库，两件事</p>
        <h1>自习室</h1>
      </div>
      <p class="today" id="today"></p>
    </header>

    <nav class="tabs" aria-label="功能">
      <button class="tab active" data-view="review">今日复习</button>
      <button class="tab" data-view="notes">笔记</button>
      <button class="tab" data-view="cards">卡片</button>
      <button class="tab" data-view="stats">统计</button>
    </nav>

    <div class="domains" id="domains"></div>
    <p class="hint" id="sync-address"></p>

    <main id="view"></main>
    <p class="toast" id="toast" hidden></p>
  </div>
  <script src="/static/app.js?v=11"></script>
</body>
</html>
